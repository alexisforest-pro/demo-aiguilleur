<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111f30">
  <meta name="description" content="L’AIGUILLEUR — supervision des incidents et aide à la décision ferroviaire.">
  <title>L’AIGUILLEUR · Supervision ferroviaire</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <div class="app-shell">
    <aside class="rail" aria-label="Navigation principale">
      <a class="brand" href="#overview" aria-label="L’AIGUILLEUR, vue d’ensemble">L’<span>AI</span>GUILLEUR<span class="brand-sub">SUPERVISION FERROVIAIRE</span></a>
      <div class="rail-label">ESPACE OPÉRATIONS</div>
      <button class="rail-link active" data-action="overview"><span data-icon="grid"></span><span>Vue d’ensemble</span><span id="nav-count" class="rail-count">—</span></button>
      <button class="rail-link" data-action="incidents"><span data-icon="route"></span><span>Incidents en cours</span></button>
      <div class="rail-bottom"><div class="rail-rule"></div><span class="rail-caption">La bonne information.<br>Au bon moment.</span><div class="rail-signature">ASSISTANCE À LA DÉCISION</div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><span data-icon="route"></span><span>Exploitation</span><span class="slash">/</span><strong id="breadcrumb-label">Vue d’ensemble</strong></div><div class="topbar-right"><span class="live-dot"></span><span>Centre de supervision</span><time id="clock"></time></div></header>
      <main id="main" tabindex="-1" aria-label="Supervision des incidents"><div class="initial-loading" role="status"><span class="spinner"></span>Connexion au centre de supervision…</div></main>
      <footer class="statusbar"><span id="connection-status">Connexion au backend…</span><span id="config-status">Configuration IA en attente</span><button class="text-button" data-action="reload-config">Actualiser la connexion</button></footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <noscript><div class="noscript">JavaScript est nécessaire pour consulter les incidents et utiliser les appels.</div></noscript>
</body>
</html>
